[project]
name = "test-observer-api-charm"
version = "0.1.0"
description = "Juju charm for the Test Observer API/backend"
requires-python = ">=3.10"
dependencies = [
    "ops>=2.8.0",
    "requests==2.34.2",
    "pydantic==2.13.3",
    "cosl",
    "validators-update-status-check @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/update_status_check",
    "validators-validate-action @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/validate_action",
    "validators-base @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/base",
    "validators-postgresql-client @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/postgresql_client",
    "validators-ingress @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/ingress",
    "validators-http-interface @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/http_interface",
    "validators-prometheus-scrape @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/prometheus_scrape",
    "validators-grafana-dashboard @ git+https://github.com/canonical/charm-integration-testing.git@91c9405cd2ec410b19d8c2e4a03b4a58839f41a1#subdirectory=validators/grafana_dashboard",
]

[tool.uv]
package = false

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D100",
    "D102",
    "E501",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D101", "D103", "D104"]}
extend-exclude = ["__pycache__", "*.egg_info", "lib"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
exclude = ["lib"]

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

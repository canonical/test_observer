name: Static Analysis - SvelteKit

on:
  pull_request:
    paths:
      - 'frontend/sveltekit/**'
      - 'justfile'
      - '.github/workflows/static-analysis-sveltekit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed while this code is on an internal repo
permissions:
  contents: read

jobs:
  analyze-sveltekit:
    name: Analyze SvelteKit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/sveltekit/package-lock.json
      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends just
      - run: just sveltekit-install
      - if: ${{ !cancelled() }}
        run: just sveltekit-lint

# This is a thin wrapper workflow that triggers on frontend changes
# to automatically create an image and charm with latest changes
name: Release Frontend Automatically

on:
  push:
    branches:
      - main
      - 'testing/**'
    paths:
      - 'frontend/**'
      - 'charms/frontend/**'

permissions: {}

jobs:
  release:
    name: Release Frontend
    uses: ./.github/workflows/release-auto.yml
    permissions:
      contents: write  # Needed to create charm tags
      packages: write  # Needed to push images to the repository
    with:
      component: frontend

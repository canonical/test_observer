user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format swift_proxy '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout swift_proxy;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    server {
        listen __SWIFT_PROXY_PORT__;
        server_name _;

        location = /_internal/swift-auth {
            internal;
            proxy_pass http://127.0.0.1:30001/_internal/swift-proxy/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Swift-Proxy-Auth "__SWIFT_PROXY_AUTH_SECRET__";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ^~ /_internal/ {
            return 404;
        }

        __SWIFT_PROXY_LOGIN_LOCATION__
        __SWIFT_PROXY_LOCATIONS__

        location / {
            proxy_pass http://127.0.0.1:30001;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}

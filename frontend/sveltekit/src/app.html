<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // Apply the stored theme class before first paint so the initial loading
      // screen matches the app's background (mirrors the theme store).
      try {
        var t = localStorage.getItem("test-observer-theme");
        if (t === "dark" || t === "light")
          document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #262626;
        }
      }
      html.light #app-loading {
        background: #ffffff;
      }
      html.dark #app-loading {
        background: #262626;
      }
      #app-loading .spinner {
        width: 40px;
        height: 40px;
        /* Canonical brand orange, matching the design-system Spinner. */
        color: var(--lp-color-brand-default, #e95420);
        transform-origin: center center;
        animation: app-loading-spin 1s linear infinite;
      }
      @keyframes app-loading-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner {
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="false" data-sveltekit-preload-code="hover">
    <div id="app-loading" role="status" aria-label="Loading">
      <!-- SVG inlined from the Pragma Spinner element, as this is used before that element is available. -->
      <svg
        class="spinner"
        viewBox="0 0 16 16"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path

</html>
